<!DOCTYPE html>

<html>
<head>
    <title>Dog Adoption Application</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Dog Adoption Form -->
    <form>
        <!-- Name -->
        <input type="text" id="name" placeholder="Name"><br><br>

        <!-- Phone Number -->
        <input type="text" id="phone" placeholder="Phone Number"><br><br>

        <!-- Address -->
        <input type="text" id="address" placeholder="Address"><br><br>

        <!-- Checkbox -->
        <input type="checkbox" id="dogExperience" value="Have you ever lived with a Dog before?">
        <label for="dogExperience">Have you ever lived with a Dog before?</label><br><br>

        <!-- Multi-select breeds -->
        <select id="breeds" multiple>
            <option value="Labrador">Labrador</option>
            <option value="German Shepherd">German Shepherd</option>
            <option value="Beagle">Beagle</option>
        </select><br><br>

        <!-- Submit button -->
        <input type="submit" value="Submit">
    </form>

    <script type="text/javascript" src="./script.js"></script>
</body>
</html>
